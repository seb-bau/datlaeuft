name: Ticket-Webhooks prüfen

on:
  pull_request:
    paths:
      - app/ticket_service.py
      - app/ticket_ai_service.py
      - app/erp_sync.py
      - app/models.py
      - app/mobile_sync.py
      - app/mobile_transaction.py
      - app/commission_priority.py
      - tests/**
      - .github/workflows/ticket-webhook-transactions.yml
  push:
    branches: [master]
    paths:
      - app/ticket_service.py
      - app/ticket_ai_service.py
      - app/erp_sync.py
      - app/models.py
      - app/mobile_sync.py
      - app/mobile_transaction.py
      - app/commission_priority.py
      - tests/**
      - .github/workflows/ticket-webhook-transactions.yml

permissions:
  contents: read

jobs:
  ticket-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8.6
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: datlaeuft_test_webhooks
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Testabhängigkeiten installieren
        run: >-
          python -m pip install
          "SQLAlchemy>=2.0,<3" "Flask>=3.1,<4" "Flask-SQLAlchemy>=3.1,<4"
          "Flask-JWT-Extended>=4.7,<5" "Flask-Login>=0.6,<1" "PyMySQL>=1.1,<2" "pycountry>=26.2,<27"
      - name: Tests mit SQLite ausführen
        run: python -m unittest discover -s tests -v
      - name: MariaDB-Einstellungen prüfen
        env:
          DATLAEUFT_TEST_DATABASE_URL: mysql+pymysql://root:test-root-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/datlaeuft_test_webhooks
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATLAEUFT_TEST_DATABASE_URL"])
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT VERSION(), @@innodb_snapshot_isolation, @@transaction_isolation"
              )).one()
              print(tuple(row))
              assert row[0].startswith("11.8.6")
              assert row[1] == 1
              assert row[2] == "REPEATABLE-READ"
          PY
      - name: Gleichzeitige Zugriffe mit MariaDB prüfen
        env:
          DATLAEUFT_TEST_DATABASE_URL: mysql+pymysql://root:test-root-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/datlaeuft_test_webhooks
        run: python -m unittest discover -s tests -p test_ticket_webhook_transactions.py -v
