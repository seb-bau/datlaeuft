permissions:
  contents: read

jobs:
  ticket-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8.6
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: datlaeuft_test_webhooks
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: PDF-Systembibliotheken bereitstellen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - name: Testabhängigkeiten installieren
        run: >-
          python -m pip install
          "SQLAlchemy>=2.0,<3" "Flask>=3.1,<4" "Flask-SQLAlchemy>=3.1,<4"
          "Flask-JWT-Extended>=4.7,<5" "Flask-Login>=0.6,<1" "PyMySQL>=1.1,<2" "pycountry>=26.2,<27"
          "requests>=2.32,<3"
          "phonenumbers>=9,<10"
          "qrcode>=8,<9" "Pillow>=10,<13"
          "wowipy>=1.1.91,<2"
          "alembic>=1.16,<2"
          "icalendar>=6.3.2,<7"
          "WeasyPrint>=66,<70" "pypdf>=5.3,<7" "factur-x>=6.7,<7"
      - name: Tests mit SQLite ausführen
        run: python -m unittest discover -s tests -v
      - name: Objektauswahl mit JavaScript prüfen
        run: node --test tests/test_*.js
      - name: MariaDB-Einstellungen prüfen
        env:
          DATLAEUFT_TEST_DATABASE_URL: mysql+pymysql://root:test-root-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/datlaeuft_test_webhooks
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATLAEUFT_TEST_DATABASE_URL"])
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT VERSION(), @@innodb_snapshot_isolation, @@transaction_isolation"
              )).one()
              print(tuple(row))
              assert row[0].startswith("11.8.6")
              assert row[1] == 1
              assert row[2] == "REPEATABLE-READ"
          PY
      - name: Gleichzeitige Zugriffe mit MariaDB prüfen
        env:
          DATLAEUFT_TEST_DATABASE_URL: mysql+pymysql://root:test-root-password@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/datlaeuft_test_webhooks
        run: |
          python -m unittest discover -s tests -p test_approval_migration_recovery.py -v
          python -m unittest discover -s tests -p test_commission_approval.py -v
          python -m unittest discover -s tests -p test_commission_object_history.py -v
          python -m unittest discover -s tests -p test_commission_object_levels.py -v
          python -m unittest discover -s tests -p test_workflow_notifications.py -v
          python -m unittest discover -s tests -p test_tenant_sms_notifications.py -v
          python -m unittest discover -s tests -p test_ticket_webhook_transactions.py -v
          python -m unittest discover -s tests -p test_mobile_sync.py -v
          python -m unittest discover -s tests -p test_completion_notifications.py -v
          python -m unittest discover -s tests -p test_mobile_appointment_features.py -v
          python -m unittest discover -s tests -p test_accounting_catalog.py -v


