<div class="modal fade" id="invoiceCoverLetterModal" tabindex="-1" aria-labelledby="invoiceCoverLetterTitle" aria-hidden="true"
     data-url="{{ url_for('admin.invoice_cover_letter', invoice_id=item.id) }}"
     data-preview-url="{{ url_for('admin.invoice_cover_letter_preview', invoice_id=item.id) }}">
  <div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="invoiceCoverLetterTitle">Anschreiben erstellen</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Schließen"></button></div>
    <div class="modal-body">
      <div class="row g-4">
        <div class="col-lg-5">
          <form id="invoiceCoverLetterForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% include "admin/_invoice_cover_letter_fields.html" %}
          </form>
        </div>
        <div class="col-lg-7">
          <div id="coverLetterPreviewHint" class="text-muted p-3">Mit „Vorschau aktualisieren“ sehen Sie das Anschreiben zusammen mit der Rechnung.</div>
          <iframe id="coverLetterPreview" title="Anschreiben und Rechnung als PDF" class="w-100 border rounded" style="height:65vh" hidden></iframe>
        </div>
      </div>
      <div id="coverLetterMessage" class="small mt-3" role="status" aria-live="polite"></div>
    </div>
    <div class="modal-footer flex-wrap">
      <button type="button" class="btn btn-outline-danger me-auto" id="coverLetterRemove" hidden>Anschreiben entfernen</button>
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
      <button type="button" class="btn btn-outline-primary" id="coverLetterPreviewButton">Vorschau aktualisieren</button>
      <button type="submit" form="invoiceCoverLetterForm" class="btn btn-primary" id="coverLetterSave">Anschreiben speichern</button>
    </div>
  </div></div>
</div>
<script src="{{ url_for('static', filename='js/invoice_cover_letter.js') }}" defer></script>
