{% extends "base.html" %}
{% block title %}Terminzeitfenster{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Terminzeitfenster</h1>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-header">
    Neues Zeitfenster
  </div>

  <form method="post">
    <input
      type="hidden"
      name="csrf_token"
      value="{{ csrf_token() }}"
    >

    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">
            Code
          </label>
          <input
            class="form-control"
            name="code"
            placeholder="GANZTAG"
            required
          >
        </div>

        <div class="col-md-4">
          <label class="form-label">
            Bezeichnung
          </label>
          <input
            class="form-control"
            name="name"
            placeholder="Ganztägig"
            required
          >
        </div>

        <div class="col-md-2">
          <label class="form-label">
            Von
          </label>
          <input
            class="form-control"
            type="time"
            name="start_time"
            required
          >
        </div>

        <div class="col-md-2">
          <label class="form-label">
            Bis
          </label>
          <input
            class="form-control"
            type="time"
            name="end_time"
            required
          >
        </div>

        <div class="col-md-1">
          <label class="form-label">
            Sortierung
          </label>
          <input
            class="form-control"
            type="number"
            name="sort_order"
            value="0"
          >
        </div>

        <div class="col-md-1 d-flex align-items-end">
          <div class="form-check mb-2">
            <input
              class="form-check-input"
              type="checkbox"
              name="active"
              id="newWindowActive"
              checked
            >
            <label
              class="form-check-label"
              for="newWindowActive"
            >
              Aktiv
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer text-end">
      <button
        class="btn btn-primary"
        type="submit"
      >
        Zeitfenster anlegen
      </button>
    </div>
  </form>
</div>

<div class="card shadow-sm">
  <div class="card-header">
    Vorhandene Zeitfenster
  </div>

  <div class="card-body">
    <table class="table table-sm table-striped datatable">
      <thead>
        <tr>
          <th>Code</th>
          <th>Bezeichnung</th>
          <th>Von</th>
          <th>Bis</th>
          <th>Sortierung</th>
          <th>Aktiv</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        {% for item in items %}
        <tr>
          <td>
            <input
              class="form-control form-control-sm"
              name="code"
              value="{{ item.code }}"
              form="windowForm{{ item.id }}"
              required
            >
          </td>

          <td>
            <input
              class="form-control form-control-sm"
              name="name"
              value="{{ item.name }}"
              form="windowForm{{ item.id }}"
              required
            >
          </td>

          <td>
            <input
              class="form-control form-control-sm"
              type="time"
              name="start_time"
              value="{{ item.start_time.strftime('%H:%M') }}"
              form="windowForm{{ item.id }}"
              required
            >
          </td>

          <td>
            <input
              class="form-control form-control-sm"
              type="time"
              name="end_time"
              value="{{ item.end_time.strftime('%H:%M') }}"
              form="windowForm{{ item.id }}"
              required
            >
          </td>

          <td>
            <input
              class="form-control form-control-sm"
              type="number"
              name="sort_order"
              value="{{ item.sort_order }}"
              form="windowForm{{ item.id }}"
            >
          </td>

          <td>
            <input
              class="form-check-input"
              type="checkbox"
              name="active"
              value="1"
              form="windowForm{{ item.id }}"
              {% if item.active %}checked{% endif %}
            >
          </td>

          <td class="text-end">
            <button
              class="btn btn-sm btn-outline-primary"
              type="submit"
              form="windowForm{{ item.id }}"
            >
              Speichern
            </button>

            <form
              id="windowForm{{ item.id }}"
              method="post"
              action="{{ url_for(
                'admin.appointment_window_update',
                item_id=item.id
              ) }}"
            >
              <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
              >
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
