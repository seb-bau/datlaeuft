{% extends "base.html" %}
{% block title %}Prüfdetailplan anlegen{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">
    Prüfdetailplan anlegen
  </h1>
</div>

<form method="post" class="card shadow-sm">
  <input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
  >

  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">
          Bezeichnung
        </label>
        <input
          class="form-control"
          name="name"
          value="{{ request.form.get(
            'name',
            ''
          ) }}"
          required
        >
      </div>

      <div class="col-md-6">
        <label class="form-label">
          Rechtsgrundlage
        </label>
        <input
          class="form-control"
          name="legal_reference"
          value="{{ request.form.get(
            'legal_reference',
            ''
          ) }}"
        >
      </div>

      <div class="col-12">
        <label class="form-label">
          Beschreibung
        </label>
        <textarea
          class="form-control"
          name="description"
          rows="4"
        >{{ request.form.get(
          'description',
          ''
        ) }}</textarea>
      </div>
    </div>
  </div>

  <div class="card-footer d-flex justify-content-between">
    <a
      class="btn btn-outline-secondary"
      href="{{ url_for(
        'safety_inspection_admin.templates'
      ) }}"
    >
      Zurück
    </a>

    <button
      class="btn btn-primary"
      type="submit"
    >
      Anlegen und Prüfpunkte bearbeiten
    </button>
  </div>
</form>
{% endblock %}
