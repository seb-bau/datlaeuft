{% extends "external_portal/base.html" %}
{% block title %}Kennwort ändern · {{ external_portal_name }} Auftragnehmerportal{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a class="btn btn-outline-secondary" href="{{ url_for('external_portal.commissions') }}" aria-label="Zurück">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h3 mb-0">Kennwort ändern</h1>
</div>

<div class="card shadow-sm portal-form-card">
  <div class="card-body p-4">
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="current_password">Bisheriges Kennwort</label>
        <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Neues Kennwort</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <div class="form-text">Mindestens 12 Zeichen.</div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password_confirmation">Neues Kennwort wiederholen</label>
        <input class="form-control" id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      </div>
      <button class="btn btn-primary" type="submit">
        Kennwort ändern
      </button>
    </form>
  </div>
</div>
{% endblock %}
